<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Demo On Prototype</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <!-- THANH THÔNG TIN -->
        <div class="top-bar">

            <div class="hp-container">

                <span>HP</span>

                <div class="hp-bar">
                    <div id="hp-fill"></div>
                </div>

            </div>

            <div id="score">
                SCORE: 0
            </div>

        </div>


        <!-- KHU VỰC GAME -->
        <canvas id="gameCanvas" width="800" height="500"></canvas>


        <!-- MÀN HÌNH GAME OVER -->
        <div id="game-over" class="hidden">

            <h1>GAME OVER</h1>

            <p id="final-score">
                Score: 0
            </p>

            <button onclick="restartGame()">
                PLAY AGAIN
            </button>

        </div>


        <!-- HƯỚNG DẪN -->
        <div class="controls">

            <p>W A S D → Di chuyển</p>

            <p>🖱️ Chuột trái → Tấn công</p>

        </div>

    </div>


    <!-- FILE JAVASCRIPT -->
    <script src="game.js"></script>

</body>
</html>
